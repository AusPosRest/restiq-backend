name: CI

# The gate on merging to main. Job name "check" is what the branch ruleset
# requires - rename it and protection silently stops matching.
# See restiq-design/setup/02-repos-and-cicd.md

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: exactly what package-lock.json says, nothing newer.
      - run: npm ci

      # src/generated is gitignored - Prisma's client is build output, not
      # source - so a fresh checkout has no client and lint/typecheck/build all
      # fail on "Cannot find module '../generated/prisma/client.js'" without
      # this. Needs no database: generate only reads prisma/schema.prisma.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # No test step yet - tests arrive with the first feature that needs them.
