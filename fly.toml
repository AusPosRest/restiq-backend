# fly.toml app configuration file generated for restiq-backend on 2026-08-20T15:21:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "restiq-backend"
primary_region = 'syd'

[build]

[env]
  # Must equal internal_port below. NODE_ENV is set in the Dockerfile.
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true

  # Scale to zero: stop when idle, start on the next request.
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  checks = [{ grace_period = '10s', interval = '30s', path = '/health', timeout = '5s' }]

  [[http_service.checks]]
    # Machine liveness. /health, not /health/db - a Neon wobble must not restart the machine.
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
