# Fly.io configuration for the restiq API.
#
# Nothing secret lives here - this file is committed. DATABASE_URL and
# WEB_ORIGIN are set with `fly secrets set`, which stores them encrypted and
# injects them as environment variables at boot.

# Must match the app that exists on Fly. Named at launch, and Fly has no easy
# rename, so the file follows the app rather than the other way round.
app = "restiq-backend"
primary_region = "syd"

[deploy]
  release_command = "npx prisma migrate deploy"

  # Node + Prisma's CLI + its Rust schema-engine binary + a TLS handshake to
  # Neon does not fit in the default 256mb - it starves and hangs with no
  # error. performance-1x's real memory minimum is 2gb (512mb/1gb are both
  # rejected at deploy time), so go straight there.
  [deploy.release_command_vm]
    size = "performance-1x"
    memory = "2gb"

[build]

[http_service]
  internal_port = 8080
  force_https = true

  # Scale to zero. Fly stops the machine when it is idle and starts it again on
  # the next request, which costs a 2-6 second wait on that first request.
  # Set min_machines_running to 1 before the first real venue trades.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # Deliberately /health and not /health/db. This check decides whether the
    # machine itself is alive; if Neon hiccups we want the API up and reporting
    # 503 on one route, not Fly tearing the machine down and restarting it.
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
