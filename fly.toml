# Fly.io configuration for the restiq API.
#
# Nothing secret lives here - this file is committed. DATABASE_URL and
# WEB_ORIGIN are set with `fly secrets set`, which stores them encrypted and
# injects them as environment variables at boot.

# Must match the app that exists on Fly. Named at launch, and Fly has no easy
# rename, so the file follows the app rather than the other way round.
app = "restiq-backend"
primary_region = "syd"

[deploy]
  release_command = "npx prisma migrate deploy"

  # Node + Prisma's CLI + its Rust schema-engine binary + a TLS handshake to
  # Neon does not fit in the default 256mb - it starves and hangs with no
  # error. performance-1x's real memory minimum is 2gb (512mb/1gb are both
  # rejected at deploy time), so go straight there.
  [deploy.release_command_vm]
    size = "performance-1x"
    memory = "2gb"

[env]
  # restiq-backend#170: the simulated card terminal approves payments with no
  # money moving. Never on in production - card is taken on the venue's own
  # terminal and recorded as an external payment until a real provider lands.
  PAYMENTS_SIMULATOR = "off"
  # restiq-backend#171: Fly's edge proxy is the one hop in front of the app,
  # so req.ip is the real client for sign-in throttling - never a raw header.
  TRUST_PROXY_HOPS = "1"

[build]

[http_service]
  internal_port = 8080
  force_https = true

  # restiq-backend#175 (audit PROD-07): always on. Scale-to-zero cost the
  # first request after idle a 2-6 s cold start - a till waiting on a PIN
  # login or a payment. One machine stays up; Fly may start more under load.
  # A second always-on machine (min 2) is the upgrade for surviving a host
  # failure without a restart gap.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    # Deliberately /health and not /health/db. This check decides whether the
    # machine itself is alive; if Neon hiccups we want the API up and reporting
    # 503 on one route, not Fly tearing the machine down and restarting it.
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# restiq-backend#175: 256 MB left no headroom for Node + Prisma + pg pool.
# 1 GB is a starting point, not a measured size - the staging load test
# (wiki/ops/staging-rehearsal.md) decides the real one.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
