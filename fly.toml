# Fly.io configuration for the restiq API. Committed, so nothing secret here -
# DATABASE_URL and WEB_ORIGIN are set with `fly secrets set`.
# Reasoning behind these values: restiq-design/setup/03-prod-environment.md

app = "restiq-backend"
primary_region = "syd"

[build]

[env]
  # Must equal internal_port below. NODE_ENV is set in the Dockerfile.
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true

  # Scale to zero: stop when idle, start on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # Machine liveness. /health, not /health/db - a Neon wobble must not restart the machine.
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  # Floor for shared-cpu-1x. Revisit if the machine starts restarting under load.
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
